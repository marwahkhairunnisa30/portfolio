    <text x="492" y="54" font-size="36" font-weight="600" fill="#eceaf5" letter-spacing="-1">56<tspan font-size="20">%</tspan></text>
    <text x="492" y="74" font-size="10" fill="rgba(236,234,245,0.45)">Revenue growth</text>

    <!-- Stat 3 -->
    <rect x="664" y="10" width="180" height="78" rx="12" fill="#131320" stroke="rgba(236,234,245,0.06)" stroke-width="1"/>
    <text x="684" y="54" font-size="36" font-weight="600" fill="#eceaf5" letter-spacing="-1">30<tspan font-size="20">%</tspan></text>
    <text x="684" y="74" font-size="10" fill="rgba(236,234,245,0.45)">Conversion lift</text>

    <!-- Stat 4 -->
    <rect x="856" y="10" width="180" height="78" rx="12" fill="#131320" stroke="rgba(236,234,245,0.06)" stroke-width="1"/>
    <text x="876" y="54" font-size="36" font-weight="600" fill="#eceaf5" letter-spacing="-1">2<tspan font-size="20">+</tspan></text>
    <text x="876" y="74" font-size="10" fill="rgba(236,234,245,0.45)">Years Top Performer</text>
