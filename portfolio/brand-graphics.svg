    <text x="300" y="54" font-size="36" font-weight="600" fill="#eceaf5" letter-spacing="-1">55<tspan font-size="20">+</tspan></text>
    <text x="300" y="74" font-size="10" fill="rgba(236,234,245,0.45)">Brand deals closed</text>

    <!-- Stat 2 -->
