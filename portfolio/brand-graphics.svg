    <line x1="0" y1="300" x2="1200" y2="300" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="0" y1="800" x2="1200" y2="800" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="900" stroke="#eceaf5" stroke-width="0.5"/>
