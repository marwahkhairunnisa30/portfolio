    <text x="680" y="46" font-size="12" fill="rgba(236,234,245,0.7)" text-anchor="middle">ig</text>

    <!-- Card example -->
    <rect x="740" y="10" width="380" height="80" rx="16" fill="#131320" stroke="rgba(236,234,245,0.08)" stroke-width="1"/>
    <text x="762" y="35" font-size="9" font-weight="600" fill="rgba(236,234,245,0.35)" letter-spacing="1">STRATEGY &amp; LEADERSHIP · 2024</text>
    <text x="762" y="57" font-size="15" font-weight="600" fill="#eceaf5">BD Team Leadership</text>
    <text x="762" y="74" font-size="11" fill="rgba(236,234,245,0.5)">47 brand partnerships in 9 months</text>
