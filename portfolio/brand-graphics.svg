    <text x="8" y="84" font-size="9" fill="rgba(236,234,245,0.4)">Deep Black</text>

    <!-- Swatch 2: #0b0b10 -->
    <rect x="100" y="16" width="90" height="72" rx="10" fill="#0b0b10" stroke="rgba(236,234,245,0.15)" stroke-width="1"/>
    <text x="108" y="72" font-size="9.5" font-weight="600" fill="rgba(236,234,245,0.8)">#0b0b10</text>
    <text x="108" y="84" font-size="9" fill="rgba(236,234,245,0.4)">Dark Navy</text>

    <!-- Swatch 3: #131320 -->
    <rect x="200" y="16" width="90" height="72" rx="10" fill="#131320" stroke="rgba(236,234,245,0.1)" stroke-width="1"/>
