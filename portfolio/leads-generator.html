<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BD Research Toolkit — Marwah K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10;--card:#13131f;--card2:#1a1a28;
  --border:rgba(255,255,255,.1);--border-dim:rgba(255,255,255,.06);
  --text:#eceaf5;--text-dim:rgba(236,234,245,.55);--text-faint:rgba(236,234,245,.3);
  --accent:#c03030;--accent-glow:rgba(192,48,48,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Onest',sans-serif}
body{display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.75rem;border-bottom:1px solid var(--border-dim);flex-shrink:0}
.hdr__back{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-dim);transition:color .2s}
.hdr__back:hover{color:var(--text)}
.hdr__brand{display:flex;align-items:center;gap:.375rem;font-size:.8125rem;font-weight:600}

/* Main split */
.main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0;padding:2rem 1.75rem;gap:1.5rem;align-items:start}

/* Form card */
.card{background:var(--card);border:1px solid var(--border);border-radius:1.25rem;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}

/* Mode toggle */
.mode-toggle{display:flex;background:var(--card2);border:1px solid var(--border-dim);border-radius:.625rem;padding:.1875rem;gap:.125rem}
.mode-btn{flex:1;padding:.4375rem .75rem;border-radius:.4375rem;font-size:.8125rem;font-weight:500;color:var(--text-dim);transition:all .2s;text-align:center}
.mode-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 12px var(--accent-glow)}

/* Field groups */
.field{display:flex;flex-direction:column;gap:.375rem}
.field-label{font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}
.field-label span{color:var(--accent)}
.inp{background:var(--card2);border:1px solid var(--border-dim);border-radius:.625rem;padding:.6875rem .875rem;font-size:.9rem;font-family:inherit;color:var(--text);transition:border-color .2s;width:100%}
.inp:focus{outline:none;border-color:rgba(192,48,48,.45)}
.inp::placeholder{color:var(--text-faint)}

/* Chip selectors */
.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{padding:.375rem .875rem;border:1px solid var(--border-dim);border-radius:9999px;font-size:.8rem;font-weight:500;color:var(--text-dim);background:transparent;transition:all .18s;cursor:pointer}
.chip:hover{border-color:rgba(255,255,255,.22);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow)}

/* Right: results */
.results-area{display:flex;flex-direction:column;height:100%;overflow-y:auto;min-height:0}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.625rem;color:var(--text-faint);text-align:center;padding:2rem}
.empty-star{font-size:1.75rem;opacity:.4;margin-bottom:.25rem}
.empty p{font-size:.875rem;line-height:1.5;max-width:22ch}

/* Results header */
.res-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:.75rem}
.res-title{font-size:1rem;font-weight:600}
.res-count{font-size:.75rem;color:var(--text-faint)}
.open-all{display:flex;align-items:center;gap:.375rem;padding:.4375rem .875rem;border:1px solid var(--border);border-radius:.5rem;font-size:.75rem;font-weight:500;color:var(--text-dim);transition:all .2s}
.open-all:hover{border-color:var(--accent);color:var(--text);background:var(--accent-glow)}

/* Group */
.group-label{font-size:.625rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin:1rem 0 .375rem}
.group-label:first-of-type{margin-top:0}

/* Link cards */
.link-card{display:flex;align-items:center;gap:.75rem;background:var(--card);border:1px solid var(--border-dim);border-radius:.75rem;padding:.75rem 1rem;text-decoration:none;transition:all .18s;margin-bottom:.375rem}
.link-card:last-child{margin-bottom:0}
.link-card:hover{border-color:rgba(192,48,48,.3);background:rgba(192,48,48,.04)}
.link-icon{width:1.875rem;height:1.875rem;display:grid;place-items:center;background:var(--card2);border:1px solid var(--border-dim);border-radius:.4375rem;flex-shrink:0;font-size:.9375rem;line-height:1}
.link-label{font-size:.875rem;font-weight:500;flex:1}
.link-arrow{color:var(--text-faint);flex-shrink:0;transition:all .18s}
.link-card:hover .link-arrow{transform:translate(2px,-2px);color:var(--accent)}
</style>
</head>
<body>

<header class="hdr">
  <a href="/" class="hdr__back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    marwah.dev
  </a>
  <div class="hdr__brand">
    <svg width="13" height="13" viewBox="0 0 48 48" fill="#c03030"><path d="M24 2c2.2 13.8 7.9 19.6 22 22-14.1 2.4-19.8 8.2-22 22-2.2-13.8-7.9-19.6-22-22 14.1-2.4 19.8-8.2 22-22Z"/></svg>
    Research Toolkit
  </div>
</header>

<div class="main">

  <!-- LEFT: Form Card -->
  <div class="card">

    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('sales')" id="btn-sales">BD / Sales</button>
      <button class="mode-btn" onclick="setMode('job')" id="btn-job">Job Hunt</button>
    </div>

    <!-- Sales fields -->
    <div id="fields-sales">
      <div class="field" style="margin-bottom:.75rem">
        <label class="field-label" for="s-brand">Nama brand <span>*</span></label>
        <input class="inp" id="s-brand" placeholder="e.g. 27AN.ID, Somethinc" autocomplete="off" oninput="debouncedGenerate()" />
      </div>
      <div class="field" style="margin-bottom:.75rem">
        <div class="field-label">Market</div>
        <div class="chips" id="chips-market">
          <button class="chip active" onclick="toggleChipSingle(this,'chips-market')">Indonesia</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-market')">SE Asia</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-market')">Global</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Platform</div>
        <div class="chips" id="chips-platform">
          <button class="chip active" onclick="toggleChipSingle(this,'chips-platform')">Semua</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-platform')">Shopee</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-platform')">Tokopedia</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-platform')">Instagram</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-platform')">TikTok</button>
        </div>
      </div>
    </div>

    <!-- Job Hunt fields -->
    <div id="fields-job" style="display:none">
      <div class="field" style="margin-bottom:.75rem">
        <label class="field-label" for="j-role">Target role <span>*</span></label>
        <input class="inp" id="j-role" placeholder="e.g. BD Manager, Marketing Lead" autocomplete="off" oninput="debouncedGenerate()" />
      </div>
      <div class="field" style="margin-bottom:.75rem">
        <div class="field-label">Tipe kerja</div>
        <div class="chips" id="chips-worktype">
          <button class="chip active" onclick="toggleChipSingle(this,'chips-worktype')">Remote</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-worktype')">Hybrid</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-worktype')">WFO</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-worktype')">Semua</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Lokasi</div>
        <div class="chips" id="chips-loc">
          <button class="chip active" onclick="toggleChipSingle(this,'chips-loc')">Indonesia</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-loc')">Jakarta</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-loc')">SE Asia</button>
          <button class="chip" onclick="toggleChipSingle(this,'chips-loc')">Global</button>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT: Results -->
  <div class="results-area">
    <div class="empty" id="emptyState">
      <div class="empty-star">✦</div>
      <p>Isi form di kiri untuk mulai riset</p>
    </div>
    <div id="resultsInner" style="display:none"></div>
  </div>

</div>

<script>
let mode = 'sales';
let timer = null;

function setMode(m) {
  mode = m;
  document.getElementById('btn-sales').classList.toggle('active', m === 'sales');
  document.getElementById('btn-job').classList.toggle('active', m === 'job');
  document.getElementById('fields-sales').style.display = m === 'sales' ? 'block' : 'none';
  document.getElementById('fields-job').style.display  = m === 'job'   ? 'block' : 'none';
  showEmpty();
}

function toggleChipSingle(el, groupId) {
  document.querySelectorAll(`#${groupId} .chip`).forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  generate();
}

function getChip(groupId) {
  const active = document.querySelector(`#${groupId} .chip.active`);
  return active ? active.textContent.trim() : '';
}

function debouncedGenerate() { clearTimeout(timer); timer = setTimeout(generate, 280); }

function encode(q) { return encodeURIComponent(q); }

function salesLinks(brand, market, platform) {
  const loc = market && market !== 'Global' ? ` ${market}` : '';
  const li_roles = '(Founder OR CEO OR Director OR "Head of Business" OR "Marketing Manager" OR "Ecommerce Manager")';
  const social = [
    { label:'Instagram', icon:'📸', url:`https://www.google.com/search?q=${encode('site:instagram.com ' + brand)}` },
    { label:'TikTok',   icon:'🎵', url:`https://www.google.com/search?q=${encode('site:tiktok.com ' + brand)}` },
    { label:'Facebook', icon:'👤', url:`https://www.google.com/search?q=${encode('site:facebook.com ' + brand)}` },
    { label:'X',        icon:'✕',  url:`https://www.google.com/search?q=${encode('site:x.com ' + brand)}` },
    { label:'Threads',  icon:'🧵', url:`https://www.google.com/search?q=${encode('site:threads.net ' + brand)}` },
  ];
  const mktplace = [
    { label:'Shopee',    icon:'🛒', url:`https://www.google.com/search?q=${encode('site:shopee.co.id ' + brand)}` },
    { label:'Tokopedia', icon:'🛍️', url:`https://www.google.com/search?q=${encode('site:tokopedia.com ' + brand)}` },
  ];
  let s = social, m2 = mktplace;
  if (platform === 'Instagram') s = social.filter(x => x.label === 'Instagram'), m2 = [];
  else if (platform === 'TikTok') s = social.filter(x => x.label === 'TikTok'), m2 = [];
  else if (platform === 'Shopee') { s = []; m2 = mktplace.filter(x => x.label === 'Shopee'); }
  else if (platform === 'Tokopedia') { s = []; m2 = mktplace.filter(x => x.label === 'Tokopedia'); }
  const groups = [{
    group:'Web', items:[
      { label:'Official Site', icon:'🌐', url:`https://www.google.com/search?q=${encode(brand + ' official site')}` },
      { label:'Google Maps',   icon:'📍', url:`https://www.google.com/maps?q=${encode(brand)}` },
    ]
  }];
  if (s.length)  groups.push({ group:'Social Media', items:s });
  if (m2.length) groups.push({ group:'Marketplace', items:m2 });
  groups.push({ group:'Decision Maker', items:[
    { label:'LinkedIn People',  icon:'💼', url:`https://www.google.com/search?q=${encode('site:linkedin.com/in/ AND (' + brand + ') AND ' + li_roles + loc)}` },
    { label:'LinkedIn Company', icon:'🏢', url:`https://www.google.com/search?q=${encode('site:linkedin.com/company/ ' + brand)}` },
  ]});
  return groups;
}

function jobLinks(role, worktype, loc) {
  const wt = worktype && worktype !== 'Semua' ? ` ${worktype}` : '';
  const l  = loc && loc !== 'Global' ? ` ${loc}` : '';
  const q  = role + wt + l;
  const li_rec = '(Recruiter OR "Talent Acquisition" OR "People & Culture" OR "HR Manager")';
  return [
    { group:'Job Boards', items:[
      { label:'LinkedIn Jobs', icon:'💼', url:`https://www.google.com/search?q=${encode('site:linkedin.com/jobs/ ' + q)}` },
      { label:'Glints',        icon:'🎯', url:`https://www.google.com/search?q=${encode('site:glints.com ' + q)}` },
      { label:'Kalibrr',       icon:'📌', url:`https://www.google.com/search?q=${encode('site:kalibrr.com ' + q)}` },
      { label:'Jobstreet',     icon:'📄', url:`https://www.google.com/search?q=${encode('site:jobstreet.co.id ' + q)}` },
      { label:'Indeed',        icon:'🔍', url:`https://www.google.com/search?q=${encode('site:id.indeed.com ' + q)}` },
    ]},
    { group:'Find Recruiter', items:[
      { label:'LinkedIn Recruiter', icon:'🤝', url:`https://www.google.com/search?q=${encode('site:linkedin.com/in/ ' + li_rec + (l ? l : ''))}` },
      { label:'Recruiter posting',  icon:'📢', url:`https://www.google.com/search?q=${encode('"hiring" "' + role + '"' + wt + l + ' site:linkedin.com')}` },
    ]},
    { group:'Open Web', items:[
      { label:'Google Jobs',    icon:'🌐', url:`https://www.google.com/search?q=${encode(q + ' lowongan kerja')}` },
      { label:'X Hiring Posts', icon:'✕',  url:`https://www.google.com/search?q=${encode('site:x.com "hiring" "' + role + '"' + wt)}` },
    ]},
  ];
}

function allUrls(groups) { return groups.flatMap(g => g.items.map(i => i.url)); }

function generate() {
  let groups, title;
  if (mode === 'sales') {
    const brand = document.getElementById('s-brand').value.trim();
    if (!brand) { showEmpty(); return; }
    const market   = getChip('chips-market');
    const platform = getChip('chips-platform');
    groups = salesLinks(brand, market, platform);
    title  = brand;
  } else {
    const role = document.getElementById('j-role').value.trim();
    if (!role) { showEmpty(); return; }
    const worktype = getChip('chips-worktype');
    const loc      = getChip('chips-loc');
    groups = jobLinks(role, worktype, loc);
    title  = role;
  }

  const urls = allUrls(groups);
  const urlsJson = JSON.stringify(urls);

  let html = `<div class="res-hdr">
    <div>
      <div class="res-title">${title}</div>
      <div class="res-count">${urls.length} search links</div>
    </div>
    <button class="open-all" onclick='openAll(${urlsJson})'>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open All
    </button>
  </div>`;

  groups.forEach(g => {
    html += `<div class="group-label">${g.group}</div>`;
    g.items.forEach(item => {
      html += `<a class="link-card" href="${item.url}" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">${item.icon}</span>
        <span class="link-label">${item.label}</span>
        <svg class="link-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>`;
    });
  });

  document.getElementById('emptyState').style.display   = 'none';
  document.getElementById('resultsInner').style.display = 'block';
  document.getElementById('resultsInner').innerHTML     = html;
}

function showEmpty() {
  document.getElementById('emptyState').style.display   = 'flex';
  document.getElementById('resultsInner').style.display = 'none';
}

function openAll(urls) {
  urls.forEach((u, i) => setTimeout(() => window.open(u, '_blank'), i * 150));
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
</script>

</body>
</html>
