  <g transform="translate(60 60) scale(1.12) translate(-61.5 -57)" fill="none" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
    <polyline class="ink" points="16,96 16,24 40,64 64,24 64,96"/>
    <line class="ink" x1="82" y1="24" x2="82" y2="96"/>
    <polyline class="ink" points="104,24 82,64 104,96"/>
