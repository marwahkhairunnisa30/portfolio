<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Constellation — Marwah K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b10;
    --border: rgba(236,234,245,.08);
    --text: #eceaf5;
    --muted: rgba(236,234,245,.4);
    --muted2: rgba(236,234,245,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    display: flex; flex-direction: column;
  }

  .nav {
    flex-shrink: 0;
    display: flex; align-items: center; gap: .625rem;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .nav a {
    display: inline-flex; align-items: center; gap: .35rem;
    color: var(--muted); text-decoration: none;
    font-size: .8rem; font-weight: 500; transition: color .15s;
  }
  .nav a:hover { color: var(--text); }
  .nav a svg { width: 12px; height: 12px; }
  .nav__sep { color: var(--border); }
  .nav__cur { font-size: .8rem; color: var(--muted2); font-weight: 500; }

  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    cursor: default;
  }

  .corner {
    position: absolute;
    bottom: 24px; left: 24px;
    pointer-events: none;
  }
  .corner__title {
    font-size: 1.1rem; font-weight: 700;
    letter-spacing: -.02em;
    color: var(--text);
    margin-bottom: 2px;
  }
  .corner__sub {
    font-size: .75rem; color: var(--muted);
    font-weight: 500;
  }

  .hint {
    position: absolute;
    bottom: 24px; right: 24px;
    font-size: .7rem; color: var(--muted2);
    font-weight: 500; pointer-events: none;
    text-align: right; line-height: 1.7;
  }

  #tip {
    position: absolute;
    background: rgba(11,11,16,.9);
    border: 1px solid rgba(236,234,245,.14);
    border-radius: 12px;
    padding: 13px 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s;
    max-width: 210px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 20;
  }
  #tip.show { opacity: 1; }
  #tip .tip-cluster {
    font-size: .62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 6px; opacity: .8;
  }
  #tip .tip-label {
    font-size: .9rem; font-weight: 700;
    color: var(--text); margin-bottom: 5px;
  }
  #tip .tip-desc {
    font-size: .76rem; color: var(--muted);
    line-height: 1.55; font-weight: 500;
  }

  .legend {
    position: absolute;
    top: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: .68rem; font-weight: 600;
    color: var(--muted2);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .legend-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }

  @media (max-width: 480px) {
    .legend { display: none; }
    .corner { bottom: 16px; left: 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 12L6 8l4-4"/></svg>
    marwah.dev
  </a>
  <span class="nav__sep">/</span>
  <span class="nav__cur">Skills Constellation</span>
</nav>

<div class="stage">
  <canvas id="c"></canvas>

  <div class="corner">
    <div class="corner__title">Marwah Khairunnisa</div>
    <div class="corner__sub">BD · Content · Tech · Research</div>
  </div>

  <div class="hint">
    Hover to explore<br>
    Drag to rearrange<br>
    Click to focus
  </div>

  <div class="legend" id="legend"></div>
  <div id="tip">
    <div class="tip-cluster" id="tipCluster"></div>
    <div class="tip-label" id="tipLabel"></div>
    <div class="tip-desc" id="tipDesc"></div>
  </div>
</div>

<script>
// ─── Data ─────────────────────────────────────────────────────────────────────
const CLUSTERS = {
  biz:     { name: 'BD & Commercial', color: '#a78bfa' },
  content: { name: 'Content & Story',  color: '#f9a8d4' },
  tech:    { name: 'Tech & Tools',     color: '#67e8f9' },
  data:    { name: 'Research & Data',  color: '#6ee7b7' },
};

const NODES = [
  { id:'bd',           label:'BD Strategy',         desc:'Pipeline building, partner acquisition, and commercial growth at scale.',            size:26, bx:.38, by:.42, cluster:'biz' },
  { id:'outreach',     label:'Cold Outreach',        desc:'Writing pitches that actually get replies — human, credible, worth responding to.',  size:20, bx:.22, by:.30, cluster:'biz' },
  { id:'partnerships', label:'Creator Partnerships', desc:'Structuring and closing brand × creator deals end-to-end.',                          size:21, bx:.53, by:.33, cluster:'biz' },
  { id:'negotiation',  label:'Negotiation',          desc:'Getting to yes without leaving value on the table.',                                 size:13, bx:.20, by:.50, cluster:'biz' },
  { id:'campaigns',    label:'Campaign Management',  desc:'Running creator campaigns from brief to post-campaign report.',                      size:15, bx:.40, by:.58, cluster:'biz' },
  { id:'storytelling', label:'Storytelling',         desc:'Turning data and ideas into something worth reading or sharing.',                    size:20, bx:.73, by:.34, cluster:'content' },
  { id:'strategy',     label:'Content Strategy',     desc:'Deciding what to say, to whom, and why it matters right now.',                      size:17, bx:.78, by:.52, cluster:'content' },
  { id:'copy',         label:'Copywriting',          desc:'Words that move people to act — without sounding like an ad.',                      size:13, bx:.86, by:.42, cluster:'content' },
  { id:'hooks',        label:'Hook Writing',         desc:'First lines that make people stop and keep reading.',                                size:13, bx:.82, by:.65, cluster:'content' },
  { id:'ai',           label:'AI Tools',             desc:'Building with and prompting LLMs to solve problems that used to need a team.',      size:20, bx:.48, by:.73, cluster:'tech' },
  { id:'automation',   label:'Automation',           desc:'Systemizing workflows so humans can focus on what actually needs them.',             size:17, bx:.33, by:.74, cluster:'tech' },
  { id:'vibe',         label:'Vibe Coding',          desc:'Shipping functional products without being a full developer.',                      size:13, bx:.20, by:.67, cluster:'tech' },
  { id:'research',     label:'Market Research',      desc:"Finding signal before committing — who, what, and whether it's worth pursuing.",    size:17, bx:.62, by:.20, cluster:'data' },
  { id:'analytics',   label:'Creator Analytics',    desc:'Reading performance data to tell what worked and what to do differently.',           size:13, bx:.76, by:.16, cluster:'data' },
];

const EDGES = [
  ['bd','outreach'], ['bd','partnerships'], ['bd','negotiation'], ['bd','campaigns'],
  ['outreach','negotiation'], ['partnerships','campaigns'],
  ['storytelling','strategy'], ['storytelling','copy'], ['strategy','hooks'], ['copy','hooks'],
  ['ai','automation'], ['automation','vibe'],
  ['research','analytics'],
  ['bd','storytelling'], ['outreach','copy'], ['partnerships','strategy'],
  ['campaigns','automation'], ['ai','outreach'], ['research','partnerships'],
  ['analytics','campaigns'], ['storytelling','research'],
];

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const tip    = document.getElementById('tip');
let W, H, dpr;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width; H = rect.height;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  initNodes();
}

// ─── State ────────────────────────────────────────────────────────────────────
let nodes = [], stars = [], shootingStars = [], edgePulses = [];
let focusedNode = null, hoveredNode = null;
let mouse = { x: -999, y: -999 };
let dragNode = null, dragOffX = 0, dragOffY = 0;
let dragDist = 0, dragStart = null;
let lastPulseSpawn = 0;
let t = 0;

function initNodes() {
  nodes = NODES.map(n => ({
    ...n,
    x: n.bx * W,
    y: n.by * H,
    phase:      Math.random() * Math.PI * 2,
    speed:      0.0003 + Math.random() * 0.0002,
    amp:        W * 0.012 + Math.random() * W * 0.008,
    phaseY:     Math.random() * Math.PI * 2,
    color:      CLUSTERS[n.cluster].color,
    pulsePhase: Math.random() * Math.PI * 2,
  }));

  // 75% neutral (#eceaf5), 25% brand warm accents (Warm Pop palette)
  const STAR_PALETTE = [
    '236,234,245', // #eceaf5 — text primary
    '236,234,245',
    '236,234,245',
    '255,107,90',  // #ff6b5a — Warm Mid
    '232,52,43',   // #e8342b — Warm Accent
    '255,179,164', // #ffb3a4 — Warm Highlight
  ];
  stars = Array.from({ length: 150 }, () => ({
    x:           Math.random() * W,
    y:           Math.random() * H,
    r:           0.3 + Math.random() * 1.1,
    a:           0.05 + Math.random() * 0.18,
    twinkle:     Math.random() * Math.PI * 2,
    twinkleSpeed:0.0008 + Math.random() * 0.002,
    rgb:         STAR_PALETTE[Math.floor(Math.random() * STAR_PALETTE.length)],
  }));
}

// ─── Shooting stars ───────────────────────────────────────────────────────────
function maybeSpawnShootingStar() {
  if (Math.random() < 0.0012 && shootingStars.length < 2) {
    const angle = Math.PI / 8 + Math.random() * (Math.PI / 5);
    const speed = 5 + Math.random() * 8;
    shootingStars.push({
      x:    Math.random() * W * 0.65,
      y:    Math.random() * H * 0.45,
      vx:   Math.cos(angle) * speed,
      vy:   Math.sin(angle) * speed,
      len:  55 + Math.random() * 110,
      a:    0.85,
      fade: 0.013 + Math.random() * 0.01,
    });
  }
}

// ─── Edge pulse spawning ──────────────────────────────────────────────────────
function trySpawnEdgePulses(node) {
  const now = Date.now();
  if (now - lastPulseSpawn < 320) return;
  lastPulseSpawn = now;
  EDGES.forEach(([a, b]) => {
    if (a !== node.id && b !== node.id) return;
    const fromId = a === node.id ? a : b;
    const toId   = a === node.id ? b : a;
    const live   = edgePulses.find(p => p.fromId === fromId && p.toId === toId && p.t < 0.25);
    if (!live) {
      edgePulses.push({
        fromId, toId,
        t:     0,
        speed: 0.009 + Math.random() * 0.005,
        color: node.color,
      });
    }
  });
}

// ─── Legend ───────────────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
Object.entries(CLUSTERS).forEach(([, c]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>${c.name}`;
  legendEl.appendChild(item);
});

// ─── Input ────────────────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  if (e.touches) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function findNearest(x, y) {
  let best = null, bestD = Infinity;
  nodes.forEach(n => {
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < Math.max(n.size + 14, 28) && d < bestD) { bestD = d; best = n; }
  });
  return best;
}

canvas.addEventListener('mousemove', e => {
  const { x, y } = getPos(e);
  mouse = { x, y };
  if (dragStart) dragDist = Math.hypot(x - dragStart.x, y - dragStart.y);
  if (dragNode) {
    dragNode.x  = x + dragOffX;
    dragNode.y  = y + dragOffY;
    dragNode.bx = dragNode.x / W;
    dragNode.by = dragNode.y / H;
  }
});

canvas.addEventListener('mousedown', e => {
  const { x, y } = getPos(e);
  dragStart = { x, y }; dragDist = 0;
  const n = findNearest(x, y);
  if (n) { dragNode = n; dragOffX = n.x - x; dragOffY = n.y - y; canvas.style.cursor = 'grabbing'; }
});

window.addEventListener('mouseup', () => {
  dragNode = null; dragStart = null;
  canvas.style.cursor = 'default';
});

canvas.addEventListener('click', e => {
  if (dragDist > 5) return;
  const { x, y } = getPos(e);
  const n = findNearest(x, y);
  focusedNode = (n && focusedNode !== n) ? n : null;
  if (!focusedNode) hideTip();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const { x, y } = getPos(e);
  const n = findNearest(x, y);
  if (n) { dragNode = n; dragOffX = n.x - x; dragOffY = n.y - y; }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const { x, y } = getPos(e);
  mouse = { x, y };
  if (dragNode) {
    dragNode.x  = x + dragOffX;
    dragNode.y  = y + dragOffY;
    dragNode.bx = dragNode.x / W;
    dragNode.by = dragNode.y / H;
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { dragNode = null; });

// ─── Tooltip ──────────────────────────────────────────────────────────────────
function showTip(node) {
  document.getElementById('tipCluster').textContent  = CLUSTERS[node.cluster].name;
  document.getElementById('tipCluster').style.color  = node.color;
  document.getElementById('tipLabel').textContent    = node.label;
  document.getElementById('tipDesc').textContent     = node.desc;
  tip.classList.add('show');
  const tw = 210, th = 100;
  let tx = node.x + node.size + 14;
  let ty = node.y - th / 2;
  if (tx + tw > W - 12) tx = node.x - node.size - tw - 14;
  if (ty < 10)           ty = 10;
  if (ty + th > H - 10)  ty = H - th - 10;
  tip.style.left = tx + 'px';
  tip.style.top  = ty + 'px';
}
function hideTip() { tip.classList.remove('show'); }

// ─── Draw helpers ─────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function drawNebula() {
  const centers = {};
  nodes.forEach(n => {
    if (!centers[n.cluster]) centers[n.cluster] = { x:0, y:0, c:0 };
    centers[n.cluster].x += n.x;
    centers[n.cluster].y += n.y;
    centers[n.cluster].c++;
  });
  Object.entries(centers).forEach(([clusterId, ctr]) => {
    const cx  = ctr.x / ctr.c;
    const cy  = ctr.y / ctr.c;
    const rgb = hexToRgb(CLUSTERS[clusterId].color);
    const r   = Math.min(W, H) * 0.24;
    const g   = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0,   `rgba(${rgb},0.06)`);
    g.addColorStop(0.5, `rgba(${rgb},0.02)`);
    g.addColorStop(1,   `rgba(${rgb},0)`);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  });
}

function drawNode(n, highlight, alpha) {
  const pulse = Math.sin(t * 0.0008 + n.pulsePhase);
  const glowR = highlight ? n.size * (2.9 + pulse * 0.35) : n.size * (1.8 + pulse * 0.22);
  const glowA = highlight ? 0.30 + pulse * 0.07 : 0.09 + pulse * 0.025;
  const rgb   = hexToRgb(n.color);

  ctx.globalAlpha = alpha;

  // outer glow
  const og = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, glowR);
  og.addColorStop(0, `rgba(${rgb},${glowA})`);
  og.addColorStop(1, `rgba(${rgb},0)`);
  ctx.beginPath(); ctx.arc(n.x, n.y, glowR, 0, Math.PI*2);
  ctx.fillStyle = og; ctx.fill();

  // corona on highlight
  if (highlight) {
    const cr = n.size * (5 + pulse * 0.6);
    const cg = ctx.createRadialGradient(n.x, n.y, n.size, n.x, n.y, cr);
    cg.addColorStop(0, `rgba(${rgb},0.07)`);
    cg.addColorStop(1, `rgba(${rgb},0)`);
    ctx.beginPath(); ctx.arc(n.x, n.y, cr, 0, Math.PI*2);
    ctx.fillStyle = cg; ctx.fill();
  }

  // inner fill
  ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI*2);
  const ig = ctx.createRadialGradient(n.x - n.size*.3, n.y - n.size*.3, 0, n.x, n.y, n.size);
  ig.addColorStop(0, `rgba(${rgb},${highlight ? .92 : .56})`);
  ig.addColorStop(1, `rgba(${rgb},${highlight ? .55 : .28})`);
  ctx.fillStyle = ig; ctx.fill();

  // ring
  ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(${rgb},${highlight ? .88 : .30})`;
  ctx.lineWidth   = highlight ? 2 : 1;
  ctx.stroke();

  // label
  if (n.size >= 18 || highlight) {
    ctx.font         = `${highlight ? 600 : 500} ${highlight ? 12 : 11}px Onest, sans-serif`;
    ctx.fillStyle    = highlight ? 'rgba(236,234,245,1)' : 'rgba(236,234,245,0.65)';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, n.x, n.y + n.size + 13);
  }

  ctx.globalAlpha = 1;
}

function drawEdge(ax, ay, bx, by, alpha) {
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.strokeStyle = `rgba(236,234,245,${alpha})`;
  ctx.lineWidth   = 0.8;
  ctx.stroke();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function frame() {
  requestAnimationFrame(frame);
  t += 16;

  ctx.clearRect(0, 0, W, H);

  drawNebula();

  // stars
  stars.forEach(s => {
    s.twinkle += s.twinkleSpeed;
    const a = s.a + Math.sin(s.twinkle) * 0.08;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${s.rgb},${a})`; ctx.fill();
  });

  // shooting stars
  maybeSpawnShootingStar();
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss  = shootingStars[i];
    const spd = Math.hypot(ss.vx, ss.vy);
    const tx  = ss.x - (ss.vx / spd) * ss.len;
    const ty  = ss.y - (ss.vy / spd) * ss.len;
    // Warm Pop brand gradient: #e8342b → #ff6b5a → #ffb3a4
    const gr  = ctx.createLinearGradient(ss.x, ss.y, tx, ty);
    gr.addColorStop(0,   `rgba(232,52,43,${ss.a})`);
    gr.addColorStop(0.4, `rgba(255,107,90,${ss.a * 0.6})`);
    gr.addColorStop(1,   'rgba(255,179,164,0)');
    ctx.beginPath(); ctx.moveTo(ss.x, ss.y); ctx.lineTo(tx, ty);
    ctx.strokeStyle = gr; ctx.lineWidth = 1.5; ctx.stroke();
    ss.x += ss.vx; ss.y += ss.vy; ss.a -= ss.fade;
    if (ss.a <= 0) shootingStars.splice(i, 1);
  }

  // float nodes
  nodes.forEach(n => {
    if (!dragNode || dragNode !== n) {
      n.x = n.bx * W + Math.sin(t * n.speed + n.phase)  * n.amp;
      n.y = n.by * H + Math.sin(t * n.speed + n.phaseY) * n.amp * 0.6;
    }
  });

  // hover
  hoveredNode = dragNode ? null : findNearest(mouse.x, mouse.y);

  if (hoveredNode) {
    canvas.style.cursor = 'grab';
    showTip(hoveredNode);
    trySpawnEdgePulses(hoveredNode);
  } else if (focusedNode) {
    canvas.style.cursor = 'default';
    showTip(focusedNode);
  } else {
    canvas.style.cursor = dragNode ? 'grabbing' : 'default';
    hideTip();
  }

  // highlight source: hovered takes priority for edges; focused controls dimming
  const hlSource = hoveredNode || focusedNode;

  // node lookup
  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  // connected ids
  const hlEdges  = new Set();
  const connected = new Set();
  if (hlSource) {
    connected.add(hlSource.id);
    EDGES.forEach(([a, b]) => {
      if (a === hlSource.id || b === hlSource.id) {
        hlEdges.add(`${a}-${b}`);
        connected.add(a); connected.add(b);
      }
    });
  }

  // edges
  EDGES.forEach(([aId, bId]) => {
    const a = nodeMap[aId], b = nodeMap[bId];
    if (!a || !b) return;
    const hl    = hlEdges.has(`${aId}-${bId}`);
    const alpha = focusedNode ? (hl ? 0.5 : 0.02) : (hl ? 0.38 : 0.07);
    drawEdge(a.x, a.y, b.x, b.y, alpha);
  });

  // edge pulses
  for (let i = edgePulses.length - 1; i >= 0; i--) {
    const p  = edgePulses[i];
    const na = nodeMap[p.fromId], nb = nodeMap[p.toId];
    if (!na || !nb || p.t > 1.1) { edgePulses.splice(i, 1); continue; }
    p.t += p.speed;
    const prog = Math.min(p.t, 1);
    const px   = na.x + (nb.x - na.x) * prog;
    const py   = na.y + (nb.y - na.y) * prog;
    const rgb  = hexToRgb(p.color);
    const pa   = Math.max(0, 0.9 - p.t * 0.85);
    // halo
    const pg = ctx.createRadialGradient(px, py, 0, px, py, 9);
    pg.addColorStop(0, `rgba(${rgb},${pa * 0.5})`);
    pg.addColorStop(1, `rgba(${rgb},0)`);
    ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI*2);
    ctx.fillStyle = pg; ctx.fill();
    // core
    ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${rgb},${pa})`; ctx.fill();
  }

  // nodes
  nodes.forEach(n => {
    const isHL = hlSource && (
      hlSource.id === n.id ||
      EDGES.some(([a, b]) => (a === hlSource.id || b === hlSource.id) && (a === n.id || b === n.id))
    );
    const alpha = focusedNode ? (connected.has(n.id) ? 1 : 0.07) : 1;
    drawNode(n, isHL, alpha);
  });

  // animated dashed ring on focused node
  if (focusedNode) {
    const n   = focusedNode;
    const pls = Math.sin(t * 0.002) * 2;
    const rgb = hexToRgb(n.color);
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.size + 7 + pls, 0, Math.PI*2);
    ctx.strokeStyle    = `rgba(${rgb},0.7)`;
    ctx.lineWidth      = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.lineDashOffset = -(t * 0.04);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  ctx.setTransform(1,0,0,1,0,0);
  resize();
});
resize();
frame();
</script>
</body>
</html>
