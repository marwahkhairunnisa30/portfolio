<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FI Calculator — Marwah K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --bg2: #060609;
    --surface: #131320;
    --surface2: #1c1c2a;
    --border: rgba(236,234,245,.12);
    --border-dim: rgba(236,234,245,.07);
    --text: #eceaf5;
    --muted: rgba(236,234,245,.45);
    --muted2: rgba(236,234,245,.28);
    --accent: #c03030;
    --accent-glow: rgba(192,48,48,.18);
    --green: #ff6b5a;
    --green-glow: rgba(255,107,90,.15);
    --input-bg: #131320;
    --r: 14px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── Nav ── */
  .nav {
    display: flex; align-items: center; gap: .625rem;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border-dim);
  }
  .nav a {
    display: inline-flex; align-items: center; gap: .35rem;
    color: var(--muted); text-decoration: none; font-size: .8rem; font-weight: 500;
    transition: color .15s;
  }
  .nav a:hover { color: var(--text); }
  .nav a svg { width: 12px; height: 12px; }
  .nav__sep { color: var(--border); font-size: .75rem; }
  .nav__cur { font-size: .8rem; color: var(--muted2); font-weight: 500; }

  /* ── Wrapper ── */
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }

  /* ── Currency toggle ── */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0 0;
  }
  .eyebrow {
    font-size: .7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--accent);
  }
  .toggle {
    display: inline-flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px; gap: 2px;
  }
  .toggle-btn {
    background: none; border: none; border-radius: 999px;
    color: var(--muted); font-family: inherit;
    font-size: .75rem; font-weight: 700;
    padding: 5px 16px; cursor: pointer;
    transition: background .2s, color .2s;
    letter-spacing: .03em;
  }
  .toggle-btn.on { background: var(--accent); color: #fff; }
  .toggle-btn:not(.on):hover { color: var(--text); }

  /* ── Hero result ── */
  .hero {
    padding: 36px 0 32px;
    text-align: center;
    position: relative;
  }
  .hero__label {
    font-size: .75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .09em; color: var(--muted); margin-bottom: 10px;
  }
  .hero__number {
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 800;
    letter-spacing: -.04em;
    line-height: 1;
    background: linear-gradient(135deg, #e8342b 0%, #ff6b5a 50%, #ffb3a4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    transition: opacity .2s;
  }
  .hero__unit {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: -.02em;
    margin-bottom: 14px;
  }
  .hero__insight {
    font-size: .9rem;
    color: var(--muted);
    font-weight: 500;
    min-height: 1.5em;
  }
  .hero__insight strong { color: var(--text); font-weight: 700; }
  .hero__insight .green { color: var(--green); font-weight: 700; }
  .hero__insight .accent { color: var(--accent); font-weight: 700; }

  /* glow blob behind number */
  .hero::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 200px;
    background: radial-gradient(ellipse, rgba(192,48,48,.12) 0%, transparent 70%);
    pointer-events: none;
    border-radius: 50%;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin-bottom: 28px;
  }

  /* ── Inputs ── */
  .inputs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 520px) { .inputs-grid { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: .75rem; color: var(--muted); font-weight: 500;
  }
  .field__wrap { position: relative; }
  .field__pfx {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted2); font-size: .85rem; font-weight: 600;
    pointer-events: none; white-space: nowrap;
  }
  .field input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text); font-family: inherit; font-size: .9rem; font-weight: 600;
    padding: 10px 12px;
    padding-left: var(--pl, 26px);
    outline: none; transition: border-color .15s;
    -moz-appearance: textfield;
  }
  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .field input[type="number"]:focus { border-color: rgba(192,48,48,.5); }

  /* return rate slider */
  .return-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 28px;
  }
  .return-card label { font-size: .75rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .return-card input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
  .return-val { font-size: .9rem; font-weight: 700; color: var(--accent); min-width: 34px; text-align: right; }

  /* ── Stats row ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 400px) { .stats { grid-template-columns: 1fr 1fr; } }

  .stat {
    background: var(--surface2);
    border: 1px solid var(--border-dim);
    border-radius: var(--r-sm);
    padding: 14px 12px;
  }
  .stat__lbl {
    font-size: .65rem; color: var(--muted2); text-transform: uppercase;
    letter-spacing: .07em; font-weight: 700; margin-bottom: 4px;
  }
  .stat__val {
    font-size: 1.25rem; font-weight: 800; letter-spacing: -.025em;
    color: var(--text);
  }
  .stat__val.a { color: var(--accent); }
  .stat__val.g { color: var(--green); }
  .stat__sub { font-size: .68rem; color: var(--muted); margin-top: 2px; }

  /* ── Progress bar ── */
  .prog-card {
    background: var(--surface2);
    border: 1px solid var(--border-dim);
    border-radius: var(--r-sm);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .prog-row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .prog-track { height: 5px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 999px;
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }

  /* ── Chart ── */
  .chart-card {
    background: var(--surface2);
    border: 1px solid var(--border-dim);
    border-radius: var(--r);
    padding: 18px;
  }
  .chart-title { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted2); margin-bottom: 14px; }
  .chart-wrap { height: 220px; position: relative; }

  /* ── Empty ── */
  .msg { text-align: center; padding: 32px; color: var(--muted); font-size: .85rem; }
  .msg b { display: block; color: var(--text); margin-bottom: 4px; font-size: .95rem; }

  .footnote { font-size: .7rem; color: var(--muted2); text-align: center; margin-top: 20px; line-height: 1.8; }

  /* animate number */
  @keyframes pop { 0%{transform:scale(.92)} 60%{transform:scale(1.03)} 100%{transform:scale(1)} }
  .hero__number.pop { animation: pop .3s cubic-bezier(.22,1,.36,1); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 12L6 8l4-4"/></svg>
    marwah.dev
  </a>
  <span class="nav__sep">/</span>
  <span class="nav__cur">FI Calculator</span>
</nav>

<div class="wrap">
  <div class="top-bar">
    <span class="eyebrow">Personal Finance</span>
    <div class="toggle">
      <button class="toggle-btn on" id="btnUSD" onclick="setCurrency('USD')">USD</button>
      <button class="toggle-btn" id="btnIDR" onclick="setCurrency('IDR')">IDR</button>
    </div>
  </div>

  <!-- Hero result -->
  <div class="hero">
    <div class="hero__label">Years to Financial Independence</div>
    <div class="hero__number" id="heroNum">19</div>
    <div class="hero__unit">years</div>
    <div class="hero__insight" id="heroInsight"></div>
  </div>

  <div class="divider"></div>

  <!-- Inputs -->
  <div class="inputs-grid">
    <div class="field">
      <label>Monthly Income (after tax)</label>
      <div class="field__wrap">
        <span class="field__pfx" id="pfxA">$</span>
        <input type="number" id="income" value="5000" min="0" step="100" style="--pl:26px">
      </div>
    </div>
    <div class="field">
      <label>Monthly Expenses</label>
      <div class="field__wrap">
        <span class="field__pfx" id="pfxB">$</span>
        <input type="number" id="expenses" value="3000" min="0" step="100" style="--pl:26px">
      </div>
    </div>
    <div class="field">
      <label>Current Savings / Investments</label>
      <div class="field__wrap">
        <span class="field__pfx" id="pfxC">$</span>
        <input type="number" id="savings" value="20000" min="0" step="1000" style="--pl:26px">
      </div>
    </div>
  </div>

  <div class="return-card">
    <label>Expected Annual Return</label>
    <input type="range" id="returnRate" min="1" max="15" step="0.5" value="7">
    <span class="return-val" id="returnLbl">7%</span>
  </div>

  <!-- Stats -->
  <div id="statsArea"></div>

  <!-- Chart -->
  <div class="chart-card">
    <div class="chart-title">Net Worth Trajectory</div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <p class="footnote">Based on the 4% rule (25× annual expenses). Assumes consistent savings & a fixed return rate.<br>Not financial advice.</p>
</div>

<script>
  let chart = null;
  let currency = 'USD';
  let lastYears = null;

  const DEFS = {
    USD: { income: 5000,     expenses: 3000,    savings: 20000,    step: [100, 100, 1000],    pl: '26px' },
    IDR: { income: 15000000, expenses: 8000000, savings: 50000000, step: [500000, 500000, 5000000], pl: '36px' }
  };

  function sym() { return currency === 'IDR' ? 'Rp ' : '$'; }

  function fmt(n) {
    if (currency === 'IDR') {
      if (n >= 1e12) return 'Rp ' + (n/1e12).toFixed(1).replace(/\.0$/,'') + 'T';
      if (n >= 1e9)  return 'Rp ' + (n/1e9).toFixed(1).replace(/\.0$/,'') + 'M';
      if (n >= 1e6)  return 'Rp ' + (n/1e6).toFixed(1).replace(/\.0$/,'') + 'Jt';
      if (n >= 1e3)  return 'Rp ' + (n/1e3).toFixed(0) + 'K';
      return 'Rp ' + Math.round(n);
    }
    if (n >= 1e6) return '$' + (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
    return '$' + Math.round(n);
  }

  function fmtMo(n) {
    if (currency === 'IDR') {
      if (n >= 1e6) return 'Rp ' + (n/1e6).toFixed(1).replace(/\.0$/,'') + 'Jt';
      if (n >= 1e3) return 'Rp ' + (n/1e3).toFixed(0) + 'K';
      return 'Rp ' + Math.round(n);
    }
    if (n >= 1e3) return '$' + (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
    return '$' + Math.round(n);
  }

  function yrToFI(pv, pmt, fv, r) {
    if (pmt <= 0 && pv >= fv) return 0;
    if (pmt <= 0) return Infinity;
    let lo = 0, hi = 200;
    for (let i = 0; i < 100; i++) {
      const m = (lo + hi) / 2;
      const f = Math.pow(1+r, m);
      pv*f + pmt*(f-1)/r < fv ? (lo = m) : (hi = m);
    }
    return (lo+hi)/2;
  }

  function nwAt(pv, pmt, r, n) {
    const f = Math.pow(1+r, n);
    return pv*f + pmt*(f-1)/r;
  }

  function animatePop() {
    const el = document.getElementById('heroNum');
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function calculate() {
    const income   = parseFloat(document.getElementById('income').value)   || 0;
    const expenses = parseFloat(document.getElementById('expenses').value) || 0;
    const savings  = parseFloat(document.getElementById('savings').value)  || 0;
    const rPct     = parseFloat(document.getElementById('returnRate').value) || 7;
    const r = rPct / 100;

    const mo_save    = income - expenses;
    const yr_save    = mo_save * 12;
    const sv_rate    = income > 0 ? (mo_save / income) * 100 : 0;
    const fi_num     = expenses * 12 * 25;
    const prog       = fi_num > 0 ? Math.min((savings / fi_num) * 100, 100) : 0;
    const years      = yrToFI(savings, yr_save, fi_num, r);
    const targetYear = new Date().getFullYear() + (years === Infinity ? 0 : Math.ceil(years));

    // Hero number
    const heroNum = document.getElementById('heroNum');
    const heroInsight = document.getElementById('heroInsight');

    if (income <= 0 || mo_save <= 0) {
      heroNum.textContent = '—';
      heroInsight.innerHTML = '<span>Expenses meet or exceed income — adjust your numbers.</span>';
      document.getElementById('statsArea').innerHTML = '';
      renderChart([], [], 0);
      return;
    }

    const yrsLabel = years < 1 ? '<1' : Math.ceil(years).toString();
    if (yrsLabel !== lastYears) { animatePop(); lastYears = yrsLabel; }
    heroNum.textContent = yrsLabel;

    // Insight line
    const rateColor = sv_rate >= 50 ? 'green' : 'accent';
    if (years < 1) {
      heroInsight.innerHTML = `You're <strong>already financially independent</strong>. Your savings cover 25× annual expenses.`;
    } else {
      heroInsight.innerHTML = `Saving <span class="${rateColor}">${sv_rate.toFixed(0)}%</span> of income → reach <strong>${fmt(fi_num)}</strong> by <strong>${targetYear}</strong>`;
    }

    // Stats
    document.getElementById('statsArea').innerHTML = `
      <div class="stats">
        <div class="stat">
          <div class="stat__lbl">Savings Rate</div>
          <div class="stat__val ${sv_rate >= 25 ? 'a' : ''}">${sv_rate.toFixed(0)}%</div>
          <div class="stat__sub">${fmtMo(mo_save)}/month</div>
        </div>
        <div class="stat">
          <div class="stat__lbl">FI Number</div>
          <div class="stat__val">${fmt(fi_num)}</div>
          <div class="stat__sub">25× annual spend</div>
        </div>
        <div class="stat">
          <div class="stat__lbl">Already saved</div>
          <div class="stat__val g">${prog.toFixed(1)}%</div>
          <div class="stat__sub">of FI number</div>
        </div>
      </div>
      <div class="prog-card">
        <div class="prog-row"><span>Progress toward FI</span><span>${fmt(savings)} of ${fmt(fi_num)}</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${prog}%"></div></div>
      </div>
    `;

    // Chart data
    const max = years === Infinity ? 40 : Math.min(Math.ceil(years) + 5, 60);
    const labels = [], data = [];
    for (let y = 0; y <= max; y++) { labels.push(`Y${y}`); data.push(nwAt(savings, yr_save, r, y)); }
    renderChart(labels, data, fi_num);
  }

  function renderChart(labels, data, fiNum) {
    const ctx = document.getElementById('chart').getContext('2d');
    if (chart) { chart.destroy(); chart = null; }
    if (!labels.length) return;

    const cross = data.findIndex(v => v >= fiNum);
    const ptR = data.map((_,i) => i === cross ? 6 : 0);
    const ptC = data.map(v => v >= fiNum ? '#ffb3a4' : '#c03030');

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Net Worth', data,
            borderColor: '#c03030',
            backgroundColor: (ctx) => {
              const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 220);
              g.addColorStop(0, 'rgba(192,48,48,.22)');
              g.addColorStop(1, 'rgba(192,48,48,.01)');
              return g;
            },
            borderWidth: 2, fill: true, tension: 0.38,
            pointRadius: ptR, pointBackgroundColor: ptC, pointBorderColor: ptC,
          },
          {
            label: 'FI Number', data: labels.map(() => fiNum),
            borderColor: 'rgba(255,107,90,.35)',
            borderWidth: 1.5, borderDash: [5,4],
            fill: false, pointRadius: 0,
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: 'rgba(236,234,245,.35)', font: { size: 11, family: 'Onest' }, boxWidth: 12, padding: 14 } },
          tooltip: {
            backgroundColor: '#131320', borderColor: 'rgba(236,234,245,.12)',
            borderWidth: 1, titleColor: '#eceaf5', bodyColor: 'rgba(236,234,245,.5)',
            padding: 10,
            callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` }
          }
        },
        scales: {
          x: { ticks: { color: 'rgba(236,234,245,.22)', font: { size: 10 }, maxTicksLimit: 10 }, grid: { color: 'rgba(255,255,255,.04)' } },
          y: { ticks: { color: 'rgba(236,234,245,.22)', font: { size: 10 }, callback: v => fmt(v) }, grid: { color: 'rgba(255,255,255,.04)' } }
        }
      }
    });
  }

  function setCurrency(cur) {
    currency = cur;
    document.getElementById('btnUSD').classList.toggle('on', cur === 'USD');
    document.getElementById('btnIDR').classList.toggle('on', cur === 'IDR');

    const d = DEFS[cur];
    const pfx = cur === 'IDR' ? 'Rp' : '$';
    ['pfxA','pfxB','pfxC'].forEach(id => document.getElementById(id).textContent = pfx);

    const ids = ['income','expenses','savings'];
    ids.forEach((id, i) => {
      const inp = document.getElementById(id);
      inp.step = d.step[i];
      inp.value = [d.income, d.expenses, d.savings][i];
      inp.style.setProperty('--pl', d.pl);
    });

    lastYears = null;
    calculate();
  }

  document.getElementById('income').addEventListener('input', calculate);
  document.getElementById('expenses').addEventListener('input', calculate);
  document.getElementById('savings').addEventListener('input', calculate);

  const slider = document.getElementById('returnRate');
  const sliderLbl = document.getElementById('returnLbl');
  slider.addEventListener('input', () => { sliderLbl.textContent = slider.value + '%'; calculate(); });

  calculate();
</script>
</body>
</html>
