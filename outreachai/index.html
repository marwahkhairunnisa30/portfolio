<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TailoredAI — BD Message Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b10;
      --surface: #131320;
      --surface-hover: #181830;
      --accent: #c03030;
      --accent-hover: #a82828;
      --accent-muted: rgba(192, 48, 48, 0.12);
      --text: #eceaf5;
      --text-muted: rgba(236, 234, 245, 0.5);
      --text-dim: rgba(236, 234, 245, 0.3);
      --border: rgba(236, 234, 245, 0.08);
      --border-hover: rgba(236, 234, 245, 0.18);
      --r-card: 1.25rem;
      --r-pill: 9999px;
    }

    html { height: 100%; overflow: hidden; }

    body {
      font-family: 'Onest', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      overflow: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      height: 100vh;
      max-width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cols {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 1rem;
      padding: 0 1rem 1rem;
      overflow: hidden;
      align-items: stretch;
    }

    .left-col {
      flex: 0 0 50%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .right-col {
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding-top: 0;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ─────────────────────────── */
    header {
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .logo svg { display: block; }

    .brand-copy h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .brand-copy p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .back-link {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 0.4rem 0.9rem;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .back-link:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    /* ─── OWNER TOGGLE ───────────────────── */
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .owner-input {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 0.35rem 0.75rem;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--text);
      outline: none;
      width: 0;
      opacity: 0;
      pointer-events: none;
      transition: width 0.2s ease, opacity 0.2s ease, border-color 0.15s;
      overflow: hidden;
    }

    .owner-input.visible {
      width: 140px;
      opacity: 1;
      pointer-events: auto;
    }

    .owner-input:focus { border-color: rgba(192,48,48,0.45); }

    .owner-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.35rem;
      opacity: 0.25;
      transition: opacity 0.15s;
      line-height: 1;
      flex-shrink: 0;
    }

    .owner-btn:hover { opacity: 0.55; }
    .owner-btn.unlocked { opacity: 0.8; }

    /* ─── CARD ───────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 1.5rem;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ─── FORM ───────────────────────────── */
    .form-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; }
    .field-full { grid-column: 1 / -1; }
    .lang-col { display: flex; flex-direction: column; justify-content: flex-end; }

    .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .input, .select {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      padding: 0.7rem 0.875rem;
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .input:focus, .select:focus {
      border-color: rgba(192, 48, 48, 0.45);
    }

    .input::placeholder { color: var(--text-dim); }

    .select-wrap { position: relative; }

    .select-wrap::after {
      content: '';
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      border-left: 4.5px solid transparent;
      border-right: 4.5px solid transparent;
      border-top: 5.5px solid var(--text-muted);
      pointer-events: none;
    }

    .select option { background: #1c1c2e; }

    /* ─── CHIPS ──────────────────────────── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.375rem 0.875rem;
      border-radius: var(--r-pill);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .chip:hover { border-color: var(--border-hover); color: var(--text); }
    .chip.on { border-color: var(--accent); background: var(--accent-muted); color: var(--text); }

    /* ─── TONE CARDS ─────────────────────── */
    .tone-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.625rem;
    }

    .tone-card {
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.9rem 0.5rem 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .tone-card:hover { border-color: var(--border-hover); background: var(--surface-hover); }

    .tone-card.on { border-color: var(--accent); background: var(--accent-muted); }

    .tone-card .t-icon { font-size: 1.25rem; margin-bottom: 0.3rem; line-height: 1; }

    .tone-card .t-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .tone-card.on .t-label { color: var(--text); }

    /* ─── APPROACH CARDS ─────────────────── */
    .approach-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.625rem;
    }

    .approach-card {
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.875rem 0.625rem 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .approach-card:hover { border-color: var(--border-hover); background: var(--surface-hover); }
    .approach-card.on { border-color: var(--accent); background: var(--accent-muted); }

    .approach-card .a-icon { font-size: 1.125rem; margin-bottom: 0.3rem; line-height: 1; }

    .approach-card .a-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .approach-card.on .a-label { color: var(--text); }

    .approach-card .a-desc {
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* ─── LANG TOGGLE ────────────────────── */
    .lang-toggle {
      display: inline-flex;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 0.25rem;
      gap: 0.125rem;
    }

    .lang-btn {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.375rem 1.125rem;
      border-radius: var(--r-pill);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .lang-btn.on { background: var(--accent); color: #fff; }

    /* ─── GENERATE BUTTON ────────────────── */
    .gen-btn {
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      width: 100%;
      padding: 0.9rem;
      border-radius: var(--r-pill);
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s, transform 0.1s;
      margin-top: 0.25rem;
    }

    .gen-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .gen-btn:active:not(:disabled) { transform: scale(0.99); }
    .gen-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── OUTPUT ─────────────────────────── */
    .right-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--text-dim);
      text-align: center;
      padding: 2rem;
    }

    .right-empty svg { opacity: 0.3; }

    .right-empty p {
      font-size: 0.875rem;
      line-height: 1.5;
    }

    #output {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .error-banner {
      background: rgba(192,48,48,0.1);
      border: 1px solid rgba(192,48,48,0.28);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      font-size: 0.9rem;
      color: #f87171;
      margin-bottom: 1rem;
      display: none;
    }

    .results {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .result-card {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      padding: 1.5rem;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.38s ease forwards;
    }

    .result-card:nth-child(1) { animation-delay: 0.04s; }
    .result-card:nth-child(2) { animation-delay: 0.13s; }
    .result-card:nth-child(3) { animation-delay: 0.22s; }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .var-pill {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      background: rgba(192,48,48,0.14);
      color: #e06060;
      border: 1px solid rgba(192,48,48,0.22);
      padding: 0.2rem 0.65rem;
      border-radius: var(--r-pill);
    }

    .copy-btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover { color: var(--text); border-color: var(--border-hover); }
    .copy-btn.ok { color: #4ade80; border-color: rgba(74,222,128,0.28); }

    .result-body {
      font-size: 0.9375rem;
      line-height: 1.75;
      color: rgba(236,234,245,0.88);
      white-space: pre-wrap;
    }

    /* ─── FOOTER ─────────────────────────── */
    footer {
      display: none;
    }

    .footer-main {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer-main a {
      color: var(--text);
      text-decoration: none;
    }

    .footer-main a:hover { text-decoration: underline; }

    .footer-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.375rem;
    }

    /* ─── MOBILE ──────────────────────────── */
    @media (max-width: 768px) {
      html, body { height: auto; overflow: auto; }
      .page { height: auto; overflow: visible; }
      .cols { flex-direction: column; height: auto; overflow: visible; padding: 0 1rem 1.5rem; }
      .left-col { flex: none; width: 100%; }
      .right-col { min-height: 400px; }
      .card { overflow-y: visible; }
    }

    @media (max-width: 480px) {
      .card { padding: 1.25rem; }
      header { padding: 0.625rem 1rem; }
      .brand-copy h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER (full-width top bar) -->
  <header>
    <div class="header-brand">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4L21.7 13.8L32 19L21.7 24.2L19 34L16.3 24.2L6 19L16.3 13.8Z" fill="#c03030"/>
          <circle cx="30.5" cy="8.5" r="2.2" fill="#c03030" opacity="0.42"/>
          <circle cx="8" cy="8" r="1.4" fill="#c03030" opacity="0.27"/>
          <circle cx="31" cy="30" r="1.2" fill="#c03030" opacity="0.2"/>
        </svg>
      </div>
      <div class="brand-copy">
        <h1>TailoredAI</h1>
        <p>Craft personalized BD messages in seconds</p>
      </div>
    </div>
    <div class="header-right">
      <a class="back-link" href="https://marwahk-portfolio.vercel.app" target="_blank" rel="noopener">← Back to Portfolio</a>
      <input id="owner-input" class="owner-input" type="password" placeholder="owner code" autocomplete="off" />
      <button id="owner-btn" class="owner-btn" title="Owner access">🔐</button>
    </div>
  </header>

  <div class="cols">
  <div class="left-col">
  <!-- FORM -->
  <div class="card">
    <div class="form-stack">

      <!-- Brand Name | Industry -->
      <div>
        <label class="field-label" for="brand">Brand Name</label>
        <input id="brand" class="input" type="text" placeholder="e.g. Erigo, Somethinc, Wardah" autocomplete="off" />
      </div>
      <div>
        <label class="field-label" for="industry">Industry</label>
        <div class="select-wrap">
          <select id="industry" class="select">
            <option value="">Select industry…</option>
            <option value="Fashion">Fashion</option>
            <option value="F&B">F&B</option>
            <option value="Beauty">Beauty</option>
            <option value="Sports">Sports</option>
            <option value="Electronics">Electronics</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Platform (full) -->
      <div class="field-full">
        <label class="field-label">Target Platform</label>
        <div class="chips" id="platform-chips">
          <button class="chip" data-v="Shopee">Shopee</button>
          <button class="chip" data-v="Tokopedia">Tokopedia</button>
          <button class="chip" data-v="TikTok Shop">TikTok Shop</button>
          <button class="chip" data-v="Lazada">Lazada</button>
          <button class="chip" data-v="Instagram">Instagram</button>
          <button class="chip" data-v="Other">Other</button>
        </div>
      </div>

      <!-- Approach Type (full) -->
      <div class="field-full">
        <label class="field-label">Approach Type</label>
        <div class="approach-row" id="approach-cards">
          <button class="approach-card on" data-v="Personal">
            <div class="a-icon">🧑</div>
            <div class="a-label">Personal</div>
            <div class="a-desc">To an individual — warm, peer-to-peer</div>
          </button>
          <button class="approach-card" data-v="Brand">
            <div class="a-icon">✦</div>
            <div class="a-label">Brand</div>
            <div class="a-desc">To the brand — collaborative, friendly</div>
          </button>
          <button class="approach-card" data-v="Company">
            <div class="a-icon">🏢</div>
            <div class="a-label">Company</div>
            <div class="a-desc">To the team — formal, outcome-focused</div>
          </button>
        </div>
      </div>

      <!-- Contact Name | Goal -->
      <div>
        <label class="field-label" for="contact">Contact Name <span style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0;font-size:0.7rem;">optional</span></label>
        <input id="contact" class="input" type="text" placeholder="e.g. Dinda, Rizky" autocomplete="off" />
      </div>
      <div>
        <label class="field-label" for="goal">Outreach Goal</label>
        <div class="select-wrap">
          <select id="goal" class="select">
            <option value="">Select goal…</option>
            <option value="Brand Partnership">Brand Partnership</option>
            <option value="Event Collaboration">Event Collaboration</option>
            <option value="Brand Activation">Brand Activation</option>
            <option value="Reseller Program">Reseller Program</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Sender Name | Sender Company -->
      <div>
        <label class="field-label" for="sender-name">Your Name</label>
        <input id="sender-name" class="input" type="text" placeholder="e.g. Marwah" autocomplete="off" />
      </div>
      <div>
        <label class="field-label" for="sender-company">Your Company / Team</label>
        <input id="sender-company" class="input" type="text" placeholder="e.g. AHA Commerce" autocomplete="off" />
      </div>

      <!-- Tone | Language -->
      <div>
        <label class="field-label">Tone</label>
        <div class="tone-row" id="tone-cards">
          <button class="tone-card" data-v="Formal">
            <div class="t-icon">🤝</div>
            <div class="t-label">Formal</div>
          </button>
          <button class="tone-card on" data-v="Semi-formal">
            <div class="t-icon">✨</div>
            <div class="t-label">Semi-formal</div>
          </button>
          <button class="tone-card" data-v="Casual">
            <div class="t-icon">👋</div>
            <div class="t-label">Casual</div>
          </button>
        </div>
      </div>
      <div class="lang-col">
        <label class="field-label">Output Language</label>
        <div class="lang-toggle" id="lang-toggle">
          <button class="lang-btn on" data-v="Bahasa Indonesia">Indonesia</button>
          <button class="lang-btn" data-v="English">English</button>
        </div>
      </div>

      <!-- Submit (full) -->
      <button class="gen-btn field-full" id="gen-btn" type="button">Generate Messages</button>

    </div>
  </div>

  </div><!-- /left-col -->

  <!-- RIGHT: OUTPUT -->
  <div class="right-col">
    <div class="right-empty" id="right-empty">
      <svg width="36" height="36" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 4L21.7 13.8L32 19L21.7 24.2L19 34L16.3 24.2L6 19L16.3 13.8Z" fill="#eceaf5"/>
        <circle cx="30.5" cy="8.5" r="2.2" fill="#eceaf5" opacity="0.6"/>
        <circle cx="8" cy="8" r="1.4" fill="#eceaf5" opacity="0.4"/>
        <circle cx="31" cy="30" r="1.2" fill="#eceaf5" opacity="0.3"/>
      </svg>
      <p>Fill in the form and click<br>Generate to see your messages</p>
    </div>
    <div id="output" style="display:none">
      <div class="error-banner" id="error-banner"></div>
      <div class="results" id="results"></div>
    </div>
  </div>

  </div><!-- /cols -->

  <footer>
    <div class="footer-main">
      Built by <a href="https://marwahk-portfolio.vercel.app" target="_blank" rel="noopener">Marwah K</a> · Personal Project
    </div>
    <div class="footer-sub">Powered by Claude AI</div>
  </footer>

</div>
<script>
  // ── state
  const platforms = new Set();
  let approachType = 'Personal';
  let tone = 'Semi-formal';
  let lang = 'Bahasa Indonesia';

  // ── owner mode
  const ownerBtn = document.getElementById('owner-btn');
  const ownerInputEl = document.getElementById('owner-input');
  let ownerToken = '';
  try { ownerToken = localStorage.getItem('tai-owner') || ''; } catch {}

  function applyOwnerState() {
    if (ownerToken) {
      ownerBtn.textContent = '🔓';
      ownerBtn.classList.add('unlocked');
    } else {
      ownerBtn.textContent = '🔐';
      ownerBtn.classList.remove('unlocked');
    }
  }
  applyOwnerState();

  ownerBtn.addEventListener('click', () => {
    ownerInputEl.classList.toggle('visible');
    if (ownerInputEl.classList.contains('visible')) {
      ownerInputEl.value = ownerToken;
      ownerInputEl.focus();
      ownerInputEl.select();
    }
  });

  ownerInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      ownerToken = ownerInputEl.value.trim();
      try { localStorage.setItem('tai-owner', ownerToken); } catch {}
      ownerInputEl.classList.remove('visible');
      applyOwnerState();
    }
    if (e.key === 'Escape') {
      ownerInputEl.classList.remove('visible');
    }
  });

  // ── platform chips
  document.querySelectorAll('#platform-chips .chip').forEach(c => {
    c.addEventListener('click', () => {
      const v = c.dataset.v;
      if (platforms.has(v)) { platforms.delete(v); c.classList.remove('on'); }
      else { platforms.add(v); c.classList.add('on'); }
    });
  });

  // ── approach type cards
  document.querySelectorAll('#approach-cards .approach-card').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#approach-cards .approach-card').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      approachType = c.dataset.v;
    });
  });

  // ── tone cards
  document.querySelectorAll('#tone-cards .tone-card').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#tone-cards .tone-card').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      tone = c.dataset.v;
    });
  });

  // ── language toggle
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#lang-toggle .lang-btn').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      lang = b.dataset.v;
    });
  });

  // ── generate
  const genBtn = document.getElementById('gen-btn');
  const outputEl = document.getElementById('output');
  const rightEmptyEl = document.getElementById('right-empty');
  const errorBanner = document.getElementById('error-banner');
  const resultsEl = document.getElementById('results');

  genBtn.addEventListener('click', async () => {
    const brand = document.getElementById('brand').value.trim();
    const industry = document.getElementById('industry').value;
    const goal = document.getElementById('goal').value;
    const contact = document.getElementById('contact').value.trim();
    const senderName = document.getElementById('sender-name').value.trim();
    const senderCompany = document.getElementById('sender-company').value.trim();

    if (!brand) return showError('Please enter a brand name.');
    if (!industry) return showError('Please select an industry.');
    if (!platforms.size) return showError('Please select at least one target platform.');
    if (!goal) return showError('Please select an outreach goal.');
    if (!senderName) return showError('Please enter your name.');
    if (!senderCompany) return showError('Please enter your company or team.');

    setLoading(true);
    hideError();
    outputEl.style.display = 'none';

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          brand,
          industry,
          platform: Array.from(platforms).join(', '),
          approach_type: approachType,
          contact_name: contact || 'not provided',
          tone,
          goal,
          language: lang,
          sender_name: senderName,
          sender_company: senderCompany,
          ...(ownerToken ? { owner_token: ownerToken } : {}),
        }),
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Something went wrong.');

      renderResults(data.variations);
    } catch (err) {
      showError(err.message || 'Failed to generate messages. Please try again.');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(on) {
    genBtn.disabled = on;
    genBtn.innerHTML = on
      ? '<div class="spinner"></div> Generating…'
      : 'Generate Messages';
  }

  function renderResults(variations) {
    resultsEl.innerHTML = '';
    (variations || []).forEach(v => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-top">
          <span class="var-pill">${esc(v.name)}</span>
          <button class="copy-btn">Copy</button>
        </div>
        <p class="result-body">${esc(v.message)}</p>
      `;
      card.querySelector('.copy-btn').addEventListener('click', function () {
        copyText(v.message, this);
      });
      resultsEl.appendChild(card);
    });

    hideError();
    rightEmptyEl.style.display = 'none';
    outputEl.style.display = 'flex';
  }

  function copyText(text, btn) {
    const done = () => {
      btn.textContent = 'Copied ✓';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
    };

    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      const ta = Object.assign(document.createElement('textarea'), {
        value: text,
        style: 'position:fixed;opacity:0',
      });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    rightEmptyEl.style.display = 'none';
    outputEl.style.display = 'flex';
  }

  function hideError() {
    errorBanner.style.display = 'none';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
